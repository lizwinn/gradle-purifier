// The fixture of the conformance-update check: a dynamic version that
// Gradle's dependency locking pins to an old version, 3.12.0, in
// gradle.lockfile. `gradle-purifier update` moves both lockfiles to the
// newest 3.x.
plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.+'
}
