//
// The IDE init script of gradle-purifier. `gradle-purifier ide` installs it
// in the Gradle user home's init.d, where Gradle applies it to every
// build, including the builds an IDE runs through the Gradle tooling API
// to import a project.
//
// In a build where `gradle-purifier ide` has realized the lockfile, it
// applies gradle-purifier's init script in interactive mode, so the build
// reads the locked downloads. `gradle-purifier ide` writes what it needs
// to .gradle/purifier/ide.properties at the build root: the tree of
// locked downloads, the plugin portal within it, the init script, and
// the SHA-256 of the lockfile it realized. In any other build, and in a
// build the gradle-purifier command runs itself, it does nothing.

def portalKey = 'org.gradle.internal.plugins.portal.url.override'

// A daemon runs many builds; what this script set for an earlier one goes.
if (System.getProperty('gradle.purifier.ide') != null) {
    ['gradle.purifier.ide', 'gradle.purifier.mode', 'gradle.purifier.repository', portalKey].each {
        System.clearProperty(it)
    }
}
if (System.getenv('GRADLE_PURIFIER_MODE')) {
    return
}

def dir = gradle.startParameter.projectDir ?: gradle.startParameter.currentDir
while (dir != null && !new File(dir, 'settings.gradle').isFile() && !new File(dir, 'settings.gradle.kts').isFile()) {
    dir = dir.parentFile
}
if (dir == null) {
    return
}
def properties = new File(dir, '.gradle/purifier/ide.properties')
def lockfile = new File(dir, 'gradle-purifier.lock.json')
if (!properties.isFile() || !lockfile.isFile()) {
    return
}
def p = new Properties()
properties.withInputStream { p.load(it) }
def sha256 = java.security.MessageDigest.getInstance('SHA-256').digest(lockfile.bytes).encodeHex().toString()
if (p.getProperty('lockSha256') != sha256) {
    println "gradle-purifier: gradle-purifier.lock.json changed since 'gradle-purifier ide' ran; run 'gradle-purifier ide' again, so this build reads the locked downloads. It resolves the usual way now."
    return
}

System.setProperty('gradle.purifier.ide', '1')
System.setProperty('gradle.purifier.mode', 'interactive')
System.setProperty('gradle.purifier.repository', p.getProperty('repository'))
System.setProperty(portalKey, p.getProperty('portal'))
apply from: p.getProperty('initScript')
