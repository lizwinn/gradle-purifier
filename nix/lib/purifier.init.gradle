// SPDX-License-Identifier: MIT
//
// The init script of gradle-purifier. The gradle-purifier command and the
// Nix builder (build-gradle-project.nix) pass it to Gradle with
// --init-script, and environment variables select what it does:
//
//   GRADLE_PURIFIER_MODE        lock, sandbox, interactive or publish;
//                               without it the script does nothing
//   GRADLE_PURIFIER_REPOSITORY  the base URL that stands in for every
//                               remote repository: the recorder's
//                               http://127.0.0.1:<port> in a lock run, and
//                               a file: URL of the tree of locked downloads
//                               otherwise
//   GRADLE_PURIFIER_OUTPUT      the directory the lock and sandbox modes
//                               write to
//   GRADLE_PURIFIER_CHECK       "1" makes purifierBuild run `check` too
//   GRADLE_PURIFIER_ARTIFACTS   in publish mode, a JSON object from project
//                               id to the Maven output of its Nix package
//   GRADLE_PURIFIER_KONAN_PROPERTIES
//                               konan.properties settings that every
//                               Kotlin/Native link overrides, such as the
//                               dynamic linker of the programs it links
//   GRADLE_PURIFIER_KONAN_DATA_DIR
//                               the Kotlin/Native data directory, whose
//                               dependencies hold the locked toolchain; it
//                               becomes the konan.data.dir property of
//                               every project, which the Kotlin plugin
//                               reads in place of KONAN_DATA_DIR
//
// A remote repository at https://host/path is read from
// <base>/https/host/path. The recorder fetches each such URL from its
// remote and records it, and the tree of locked downloads holds each file
// at the same path, so the lock run and the builds from the lockfile
// resolve through the same URLs.
//
// Gradle applies an init script to every build of a composite, buildSrc
// and included builds as well as the root build, so every build resolves
// through the stand-in. The purifier tasks belong to the root build only.

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.gradle.api.artifacts.component.ModuleComponentSelector
import org.gradle.api.artifacts.repositories.MavenArtifactRepository
import org.gradle.api.artifacts.repositories.UrlArtifactRepository
import org.gradle.api.publish.maven.MavenPublication
import org.gradle.api.publish.tasks.GenerateModuleMetadata
import org.gradle.api.publish.maven.tasks.GenerateMavenPom
import org.gradle.api.publish.maven.tasks.PublishToMavenRepository
import org.gradle.api.tasks.Sync

// After a build that reads the locked downloads, the action
// PurifierMissingHint names the command that records a download the build
// needed and the lockfile does not hold. Gradle runs it once the build has
// finished (the dataflow actions of Gradle 8.1 and later).
abstract class PurifierMissingHint implements org.gradle.api.flow.FlowAction<Parameters> {
    interface Parameters extends org.gradle.api.flow.FlowParameters {
        @org.gradle.api.tasks.Input
        org.gradle.api.provider.Property<Boolean> getMissing()
    }

    @Override
    void execute(Parameters parameters) {
        if (parameters.missing.get()) {
            System.err.println("gradle-purifier: the build needs a download that the lockfile does not hold (Gradle names it above); run 'gradle-purifier lock', then 'gradle-purifier prefetch'.")
        }
    }

    // Whether a failure, or one of its causes, is a dependency Gradle could
    // not resolve.
    static boolean isMissing(Throwable failure) {
        def seen = [] as Set
        def pending = [failure]
        while (!pending.isEmpty()) {
            def t = pending.remove(0)
            if (t == null || !seen.add(t)) {
                continue
            }
            def message = t.message ?: ''
            if (message.contains('Could not find') || message.contains('Could not resolve')) {
                return true
            }
            pending.add(t.cause)
            if (t.metaClass.respondsTo(t, 'getCauses')) {
                pending.addAll(t.causes)
            }
        }
        false
    }
}

abstract class PurifierMissingHintPlugin implements Plugin<Settings> {
    @javax.inject.Inject
    abstract org.gradle.api.flow.FlowScope getFlowScope()

    @javax.inject.Inject
    abstract org.gradle.api.flow.FlowProviders getFlowProviders()

    void apply(Settings settings) {
        flowScope.always(PurifierMissingHint) { spec ->
            spec.parameters.missing.set(flowProviders.buildWorkResult.map { result ->
                result.failure.map { PurifierMissingHint.isMissing(it) }.orElse(false)
            })
        }
    }
}

// A setting comes from the environment, or else from the system property
// of the same name in lower case with dots (gradle.purifier.mode), which
// the everyday init script (user.init.gradle) sets.
def setting = { String name ->
    System.getenv(name) ?: System.getProperty(name.toLowerCase().replace('_', '.'))
}

def mode = setting('GRADLE_PURIFIER_MODE')
if (mode == null || mode.isEmpty()) {
    return
}
if (!(mode in ['lock', 'sandbox', 'interactive', 'publish'])) {
    throw new GradleException("gradle-purifier: GRADLE_PURIFIER_MODE is '${mode}'; it must be lock, sandbox, interactive or publish")
}

// A package build gives the same files each time: archives hold their
// entries in a fixed order and without the times of the files, which
// Gradle 9 does by default and Gradle 8 does not.
if (mode == 'sandbox') {
    gradle.allprojects { p ->
        p.tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach { task ->
            task.preserveFileTimestamps = false
            task.reproducibleFileOrder = true
        }
    }
}

if (mode == 'interactive' && gradle.parent == null) {
    gradle.beforeSettings { settings ->
        settings.plugins.apply(PurifierMissingHintPlugin)
    }
}
def base = setting('GRADLE_PURIFIER_REPOSITORY')
if (base == null || base.isEmpty()) {
    throw new GradleException('gradle-purifier: GRADLE_PURIFIER_MODE is set but GRADLE_PURIFIER_REPOSITORY is not')
}
def output = System.getenv('GRADLE_PURIFIER_OUTPUT')
def konanProperties = setting('GRADLE_PURIFIER_KONAN_PROPERTIES')
def konanDataDir = setting('GRADLE_PURIFIER_KONAN_DATA_DIR')
def runCheck = System.getenv('GRADLE_PURIFIER_CHECK') == '1'
def rootBuild = gradle.parent == null

// The Nix input catalog is outside the native repository and is not a
// downloaded dependency. It supplies the selected versions automatically.
def providedCatalog = setting('GRADLE_PURIFIER_PROVIDED_CATALOG')
def providedRepository = setting('GRADLE_PURIFIER_PROVIDED_REPOSITORY')
def provided = [:]
if (providedCatalog) {
    def catalog = new JsonSlurper().parse(new File(providedCatalog))
    if (catalog.version != 1 || !providedRepository) {
        throw new GradleException('gradle-purifier: invalid Nix dependency projection')
    }
    catalog.modules.each { module ->
        provided["${module.group}:${module.name}".toString()] = module.version
    }
}
def addProvidedRepository = { repositories ->
    if (!provided.isEmpty()) {
        repositories.maven {
            name = 'purifierNixInputs'
            url = new File(providedRepository).toURI()
            content { descriptor ->
                provided.keySet().each { coordinate ->
                    def parts = coordinate.split(':', 2)
                    descriptor.includeModule(parts[0], parts[1])
                }
            }
        }
        // Use matching exclusions rather than exclusiveContent: Gradle
        // forbids buildscript repositories when pluginManagement is exclusive.
        repositories.all { repository ->
            if (repository.name != 'purifierNixInputs') {
                repository.content { descriptor ->
                    provided.keySet().each { coordinate ->
                        def parts = coordinate.split(':', 2)
                        descriptor.excludeModule(parts[0], parts[1])
                    }
                }
            }
        }
    }
}
def selectProvided = { configurations ->
    configurations.configureEach { configuration ->
        configuration.resolutionStrategy.dependencySubstitution.all { substitution ->
            def requested = substitution.requested
            if (requested instanceof ModuleComponentSelector) {
                def version = provided["${requested.group}:${requested.module}".toString()]
                if (version) {
                    substitution.useTarget("${requested.group}:${requested.module}:${version}".toString(),
                        'selected by a Nix dependency')
                }
            }
        }
    }
}

// The stand-in URL of a remote URL. A URL that is not http or https, or
// that already points at the stand-in (the plugin portal, which the
// command line overrides), stays as it is, and the result is null.
def standIn = { URI uri ->
    if (uri == null || !(uri.scheme in ['http', 'https']) || uri.toString().startsWith(base)) {
        return null
    }
    def authority = uri.port == -1 ? uri.host : "${uri.host}:${uri.port}"
    return URI.create("${base}/${uri.scheme}/${authority}${uri.rawPath ?: ''}")
}

def purify = { repository ->
    if (repository instanceof UrlArtifactRepository) {
        def replaced = standIn(repository.url)
        if (replaced != null) {
            repository.url = replaced
            // The recorder serves plain HTTP on the loopback address.
            if (replaced.scheme == 'http') {
                repository.allowInsecureProtocol = true
            }
        }
    }
    if (repository instanceof MavenArtifactRepository && !repository.artifactUrls.isEmpty()) {
        repository.artifactUrls = repository.artifactUrls.collect { standIn(it) ?: it } as Set
    }
}

// The release executables Kotlin/Native links for a project, each with its
// base name and its binary.
def nativeExecutables = { project ->
    def kotlin = project.extensions.findByName('kotlin')
    if (kotlin == null || !kotlin.hasProperty('targets')) {
        return []
    }
    def executables = []
    kotlin.targets.each { target ->
        if (!target.hasProperty('binaries')) {
            return
        }
        target.binaries.each { binary ->
            if (binary.class.name.startsWith('org.jetbrains.kotlin.gradle.plugin.mpp.Executable') &&
                binary.buildType.name() == 'RELEASE') {
                executables << [name: binary.baseName, binary: binary]
            }
        }
    }
    executables.sort { it.name }
}

// The archives a project's `assemble` makes (jar, sources jar, Spring
// Boot's bootJar, a shadow jar, distZip and so on), each with a key: its
// file name without the project's version.
def assembleArchives = { project ->
    def assemble = project.tasks.findByName('assemble')
    if (assemble == null) {
        return []
    }
    assemble.taskDependencies.getDependencies(assemble)
        .findAll { it instanceof org.gradle.api.tasks.bundling.AbstractArchiveTask && it.enabled }
        .collect { task ->
            def parts = [task.archiveBaseName.getOrNull(), task.archiveAppendix.getOrNull(), task.archiveClassifier.getOrNull()]
                .findAll { it }
            [key: "${parts.join('-')}.${task.archiveExtension.get()}".toString(), task: task]
        }
        .sort { it.key }
}

// The name of a project in the lockfile and in the Nix builder: the root
// project's name for the root project, and its path with ":" as "-"
// otherwise.
def idOf = { project ->
    project.path == ':' ? project.rootProject.name : project.path.substring(1).replace(':', '-')
}

def failOnProjectRepositories = false
settingsEvaluated { settings ->
    failOnProjectRepositories = settings.dependencyResolutionManagement.repositoriesMode.get().name() == 'FAIL_ON_PROJECT_REPOS'
}
beforeSettings { settings ->
    addProvidedRepository(settings.pluginManagement.repositories)
    addProvidedRepository(settings.buildscript.repositories)
    addProvidedRepository(settings.dependencyResolutionManagement.repositories)
    settings.pluginManagement.repositories.all(purify)
    settings.buildscript.repositories.all(purify)
    settings.dependencyResolutionManagement.repositories.all(purify)
}

allprojects { project ->
    if (!provided.isEmpty()) {
        addProvidedRepository(project.buildscript.repositories)
        if (!failOnProjectRepositories) {
            addProvidedRepository(project.repositories)
        }
        selectProvided(project.configurations)
        selectProvided(project.buildscript.configurations)
        project.plugins.withId('maven-publish') {
            project.publishing.publications.withType(MavenPublication).configureEach { publication ->
                publication.versionMapping { allVariants { fromResolutionResult() } }
            }
        }
    }
    project.buildscript.repositories.all(purify)
    project.repositories.all(purify)

    if (konanDataDir) {
        project.extensions.extraProperties.set('konan.data.dir', konanDataDir)
    }

    // Every Kotlin/Native binary, test binaries included, links with the
    // konan.properties overrides.
    if (konanProperties) {
        project.afterEvaluate {
            def kotlin = project.extensions.findByName('kotlin')
            if (kotlin != null && kotlin.hasProperty('targets')) {
                kotlin.targets.all { target ->
                    if (target.hasProperty('binaries')) {
                        target.binaries.all { binary ->
                            binary.freeCompilerArgs += ["-Xoverride-konan-properties=${konanProperties}".toString()]
                        }
                    }
                }
            }
        }
    }

    if (!rootBuild || mode == 'interactive' || mode == 'publish') {
        return
    }

    def outputDir = new File(output, idOf(project))

    // Every publication publishes into the output as well, through the
    // `purifier` repository; the Nix build copies it from there.
    project.pluginManager.withPlugin('maven-publish') {
        project.publishing.repositories.maven { repository ->
            repository.name = 'purifier'
            repository.url = new File(outputDir, 'maven').toURI()
        }
    }

    // What a sandboxed package build of this project runs: the publishing
    // of its publications, the installation of its application, and, with
    // GRADLE_PURIFIER_CHECK=1, its checks.
    project.tasks.register('purifierBuild') { task ->
        task.group = 'gradle-purifier'
        task.description = 'Builds what the Nix package of this project holds.'
        task.dependsOn(project.tasks.matching { t ->
            t.name in ['publishAllPublicationsToPurifierRepository', 'purifierInstall', 'purifierNativeInstall', 'purifierArchives'] ||
                (runCheck && t.name == 'check')
        })
    }
    // The archives of `assemble` go to archives/, under their keys. The
    // Kotlin Multiplatform plugin adds archive tasks to `assemble` after
    // the init script's afterEvaluate, so the archives are read once every
    // project is evaluated, when the lock run describes them too.
    gradle.projectsEvaluated {
        def archives = assembleArchives(project)
        if (!archives.isEmpty()) {
            project.tasks.register('purifierArchives', Sync) { task ->
                archives.each { a ->
                    task.from(a.task) {
                        it.rename { a.key }
                    }
                }
                task.into(new File(outputDir, 'archives'))
            }
        }
    }
    // Kotlin/Native's release executables go to bin/, without the .kexe
    // of their file names.
    project.afterEvaluate {
        def executables = nativeExecutables(project)
        if (!executables.isEmpty()) {
            project.tasks.register('purifierNativeInstall', Sync) { task ->
                executables.each { e ->
                    task.from(e.binary.linkTaskProvider) {
                        it.include "${e.name}.kexe"
                        it.rename { e.name }
                    }
                }
                task.into(new File(outputDir, 'bin'))
            }
        }
    }
    project.pluginManager.withPlugin('application') {
        project.tasks.register('purifierInstall', Sync) { task ->
            task.from(project.tasks.named('installDist'))
            task.into(new File(outputDir, 'application'))
        }
    }

    if (mode != 'lock') {
        return
    }

    // Resolves every resolvable configuration of the project, the
    // buildscript's too, so the lock holds what a task the lock run does
    // not run would resolve. Resolution is lenient: a configuration that
    // does not resolve on its own takes no part.
    //
    // An IDE that imports the build also asks for the sources and the
    // javadoc of every library, which no task resolves, so it resolves
    // those too.
    def configurations = project.configurations
    def scriptConfigurations = project.buildscript.configurations
    def dependencyHandler = project.dependencies
    project.tasks.register('purifierResolveAll') { task ->
        task.doLast {
            def components = [] as Set
            (scriptConfigurations + configurations).findAll { it.canBeResolved }.each { configuration ->
                try {
                    configuration.incoming.artifactView { it.lenient(true) }.files.files
                    configuration.incoming.resolutionResult.allComponents.each { c ->
                        if (c.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                            components << c.id
                        }
                    }
                } catch (Exception e) {
                    task.logger.info("gradle-purifier: ${configuration.name} did not resolve: ${e.message}")
                }
            }
            if (!components.isEmpty()) {
                try {
                    dependencyHandler.createArtifactResolutionQuery()
                        .forComponents(components)
                        .withArtifacts(org.gradle.jvm.JvmLibrary,
                            org.gradle.language.base.artifact.SourcesArtifact,
                            org.gradle.language.java.artifact.JavadocArtifact)
                        .execute()
                        .resolvedComponents.each { c ->
                            c.getArtifacts(org.gradle.language.base.artifact.SourcesArtifact).each { a ->
                                if (a instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult) a.file
                            }
                            c.getArtifacts(org.gradle.language.java.artifact.JavadocArtifact).each { a ->
                                if (a instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult) a.file
                            }
                        }
                } catch (Exception e) {
                    task.logger.info("gradle-purifier: sources and javadoc did not resolve: ${e.message}")
                }
            }
        }
    }

    // The lock run: everything a package build with checks runs, for
    // every project, so its downloads hold what any package build needs.
    if (project == project.rootProject) {
        project.tasks.register('purifierLock') { task ->
            task.group = 'gradle-purifier'
            task.description = 'Runs every package build with its checks, for the lockfile.'
            task.dependsOn {
                project.rootProject.allprojects.collect { p ->
                    p.tasks.matching { t ->
                        t.name in ['build', 'purifierBuild', 'purifierResolveAll']
                    }
                }
            }
        }
    }
}

// Publish mode: every Maven publication of the root build publishes the
// files its Nix package holds, in place of the ones the build would make.
// The publications then depend on no task that compiles or packages, so
// the build's own publish tasks send what Nix built, with the repositories
// and credentials the build configures. A publication's Gradle module
// metadata is the one Nix built too.
if (rootBuild && mode == 'publish') {
    def built = new JsonSlurper().parseText(System.getenv('GRADLE_PURIFIER_ARTIFACTS') ?: '{}')
    def repositoryPath = setting('GRADLE_PURIFIER_PUBLICATION_REPOSITORY')
    def catalogPath = setting('GRADLE_PURIFIER_PUBLICATION_CATALOG')
    if (!repositoryPath || !catalogPath) {
        throw new GradleException('gradle-purifier: publishing needs the Nix publication repository and catalog')
    }
    def catalog = new JsonSlurper().parse(new File(catalogPath))
    def modules = catalog.modules.collectEntries { module ->
        [("${module.group}:${module.name}".toString()): module]
    }
    def configurePublication = { project, publication, module, originals ->
        publication.groupId = module.group
        publication.artifactId = module.name
        publication.version = module.version
        def directory = new File(repositoryPath,
            "${module.group.replace('.', '/')}/${module.name}/${module.version}".toString())
        def prefix = "${module.name}-${module.version}".toString()
        def files = originals == null ? directory.listFiles().findAll { file ->
            file.isFile() && file.name.startsWith(prefix) &&
                !(file.name == prefix + '.pom') &&
                !(file.name ==~ /.*\.(md5|sha1|sha256|sha512|asc)$/)
        }.collect { file ->
            def suffix = file.name.substring(prefix.length())
            def parts = suffix.startsWith('.') ? [null, suffix.substring(1)] : suffix.substring(1).split(/\./, 2)
            [file: file, classifier: parts[0], extension: parts[1]]
        } : originals.collect { artifact ->
            def classifier = artifact.classifier ?: null
            def suffix = (classifier ? '-' + classifier : '') + '.' + artifact.extension
            def file = new File(directory, prefix + suffix)
            if (!file.isFile()) {
                throw new GradleException("gradle-purifier: the Nix projection has no ${file.name}")
            }
            [file: file, classifier: classifier, extension: artifact.extension]
        }
        publication.artifacts = []
        files.each { replacement ->
            publication.artifact(replacement.file) { artifact ->
                artifact.classifier = replacement.classifier
                artifact.extension = replacement.extension
            }
        }
        def moduleFile = new File(directory, prefix + '.module')
        if (originals != null && moduleFile.isFile()) {
            publication.artifact(moduleFile) { artifact -> artifact.extension = 'module' }
        }
        project.tasks.withType(GenerateMavenPom).matching {
            it.name == "generatePomFileFor${publication.name.capitalize()}Publication".toString()
        }.configureEach { task ->
            task.destination = new File(directory, prefix + '.pom')
            task.enabled = false
        }
        project.tasks.withType(GenerateModuleMetadata).matching {
            it.name == "generateMetadataFileFor${publication.name.capitalize()}Publication".toString()
        }.configureEach { task -> task.enabled = false }
    }
    gradle.projectsEvaluated { g ->
        def owners = []
        def owned = [] as Set
        g.rootProject.allprojects.each { project ->
            def publishing = project.extensions.findByName('publishing')
            if (publishing == null) return
            publishing.publications.withType(MavenPublication).each { publication ->
                def coordinate = "${publication.groupId}:${publication.artifactId}".toString()
                def module = modules[coordinate]
                if (built[idOf(project)] == null || module == null) {
                    throw new GradleException("gradle-purifier: no Nix publication of ${project.path}/${publication.name}; run gradle-purifier lock")
                }
                owned.add(coordinate)
                configurePublication(project, publication, module, publication.artifacts.toList())
                owners.add(project)
            }
        }
        def extraModules = modules.findAll { coordinate, module -> !owned.contains(coordinate) }.values()
        if (!extraModules.isEmpty() && !owners.isEmpty()) {
            def host = owners[0]
            def publishing = host.extensions.getByName('publishing')
            def extras = []
            extraModules.eachWithIndex { module, index ->
                def name = "purifierNixInput${index}".toString()
                while (publishing.publications.findByName(name) != null) name += '_'
                def publication = publishing.publications.create(name, MavenPublication)
                configurePublication(host, publication, module, null)
                extras.add(publication)
            }
            // Use each original target's repository object, retaining its
            // credentials and transport settings. One upload per URL supplies
            // the input closure even for an explicitly named publish task.
            def extraNames = extras.collect { it.name } as Set
            host.tasks.withType(PublishToMavenRepository).configureEach { task ->
                if (extraNames.any { name -> task.name.startsWith("publish${name.capitalize()}PublicationTo".toString()) }) {
                    task.enabled = false
                }
            }
            def targets = owners.unique().collectMany { project ->
                project.tasks.withType(PublishToMavenRepository).findAll { task ->
                    task.publication != null && !extraNames.contains(task.publication.name)
                }
            }
            def deployments = [:]
            targets.each { target ->
                def key = target.repository.url.toString().replaceAll('/+$', '')
                if (!deployments.containsKey(key)) {
                    def repository = target.repository
                    def repositoryIndex = deployments.size()
                    deployments[key] = extras.withIndex().collect { publication, index ->
                        host.tasks.register("purifierDeployInput${index}ToRepository${repositoryIndex}".toString(),
                            PublishToMavenRepository) { task ->
                            task.publication = publication
                            task.repository = repository
                        }
                    }
                }
                target.dependsOn(deployments[key])
            }
        }
    }
}

// The projects of the lock: every project of the root build with a Maven
// publication or an application, and what each publishes. The lock run
// writes them to projects.json in the output, for the command to put in
// the lockfile.
if (rootBuild && mode == 'lock') {
    gradle.projectsEvaluated { g ->
        def projects = g.rootProject.allprojects.collect { project ->
            def publications = []
            def publishing = project.extensions.findByName('publishing')
            if (publishing != null) {
                publishing.publications.withType(MavenPublication).each { publication ->
                    publications << [
                        name      : publication.name,
                        groupId   : publication.groupId,
                        artifactId: publication.artifactId,
                        artifacts : publication.artifacts.collect { a ->
                            [
                                classifier: a.classifier ?: null,
                                extension : a.extension,
                            ]
                        }.sort { "${it.classifier ?: ''}.${it.extension}".toString() },
                    ]
                }
            }
            def application = project.extensions.findByName('application')
            [
                path        : project.path,
                publications: publications.sort { it.name },
                application : application == null ? null : [name: application.applicationName],
                executables : nativeExecutables(project).collect { it.name },
                archives    : assembleArchives(project).collect { it.key },
            ]
        }.findAll {
            !it.publications.isEmpty() || it.application != null || !it.executables.isEmpty() || !it.archives.isEmpty()
        }
        def file = new File(output, 'projects.json')
        file.parentFile.mkdirs()
        file.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            javaMajor      : Runtime.version().feature(),
            rootProjectName: g.rootProject.name,
            projects       : projects.sort { it.path },
        ]))
    }
}
