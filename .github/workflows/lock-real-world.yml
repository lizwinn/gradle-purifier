# SPDX-License-Identifier: MIT
#
# Locks a real-world project with the gradle-purifier command of this
# checkout, on a runner, and uploads the lockfile as an artifact. A
# maintainer starts it by hand (gh workflow run lock-real-world.yml), then
# commits the lockfile under tests/real-world/. The lock runs the tests of
# the project, which need a writable /tmp.
name: lock-real-world

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  petclinic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check out Spring PetClinic
        run: |
          git init -q "$RUNNER_TEMP/petclinic"
          cd "$RUNNER_TEMP/petclinic"
          git fetch -q --depth 1 https://github.com/spring-projects/spring-petclinic.git \
            "$(jq -r .rev "$GITHUB_WORKSPACE/tests/real-world/petclinic.json")"
          git checkout -q FETCH_HEAD
      - name: Lock
        env:
          GRADLE_PURIFIER_CENTRAL_MIRROR: "1"
        run: |
          command=$(nix build --no-link --print-out-paths .#gradle-purifier)/bin/gradle-purifier
          cd "$RUNNER_TEMP/petclinic"
          "$command" lock --java 17 --lockfile "$GITHUB_WORKSPACE/tests/real-world/petclinic.lock.json"
      - uses: actions/upload-artifact@v4
        with:
          name: petclinic-lock
          path: tests/real-world/petclinic.lock.json
