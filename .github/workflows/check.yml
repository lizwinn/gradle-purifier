# SPDX-License-Identifier: MIT
#
# Runs every flake check on pushes to main and on pull requests, on
# x86_64-linux and on aarch64-linux: the command, the unit tests, the Nix
# library's checks, and the sandboxed build of every test fixture from its
# lockfile. It then evaluates the checks for every system the flake
# supports, and runs the interactive-mode tests, which need Nix outside
# the sandbox.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Flake checks
        run: nix flake check --max-jobs 2 --print-build-logs
      - name: Evaluation for every system
        run: nix flake check --all-systems --no-build
      - name: Interactive mode
        run: tests/interactive.sh
